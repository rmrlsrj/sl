<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>셋리스트</title>
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-gothic.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-barun-gothic.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
<style>
:root{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}
body{--cfs:var(--fs)}   /* 곡 카드 글자 크기: 타이틀 줄맞춤 계산용 */
body.control{--cfs:15px}
body.view{background:transparent;overflow:hidden}
body.control{background:#1c1d23;font-size:14px;padding:10px}
body.view #panel,body.view #dock,body.view .foot{display:none}

/* 조작부 */
#ta{display:block;width:100%;height:64px;resize:none;padding:8px 86px 8px 8px;border-radius:8px;border:1px solid #e3cf83;background:#fff4c7;color:#2a2618;font:inherit}
#ta::placeholder{color:#8a826a}
/* 상단 고정: 입력칸(추가 버튼 내장) + 다음/완료 */
#dock{position:sticky;top:0;z-index:20;margin:0 -10px 10px;padding:10px 10px 8px;background:#1c1d23;border-bottom:1px solid #33353f}
.addbox{position:relative}
#add{position:absolute;right:20px;bottom:8px;padding:6px 14px}
.act{flex-wrap:nowrap}
.act .big{flex:1;padding:12px 14px;font-size:17px}
.act .sub{padding:12px 14px}
.foot{margin-top:12px}
button.ghost{background:none;border:1px solid #3a3c46;color:#c8cad4;padding:5px 10px;font-size:13px}
button.ghost:hover{background:rgba(255,255,255,.08)}
#ta:focus{outline:2px solid #e0b93a;outline-offset:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:#33353f;color:#fff}
button:hover{background:#40424e}
button:disabled{opacity:.4;cursor:default}
button.main{background:#1fbf6b;color:#06210f;font-weight:700}
button.main:hover{background:#27d377}
button.danger.arm{background:#c0392b}
label{display:flex;align-items:center;gap:6px;color:#c8cad4}
.hint{color:#8a8d9a;font-size:12px;margin-top:6px}
/* 설정 묶음 (접기) */
#fold{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-weight:700}
#fold .st{font-weight:400;color:#8a8d9a;font-size:12px}
#panel.fold #settings{display:none}
#settings{margin-top:4px}
#settings > .row:first-child{background:#303342;border:1px solid #3a3c4a;border-radius:10px;padding:10px 12px;justify-content:center}   /* 뷰 스타일 칸을 밝게 구분 */
#settings > .row:first-child > span:first-child{flex:0 0 100%;text-align:center}   /* 라벨은 윗줄 가운데 */
/* 뷰 스타일 버튼: 눌러서 바꾸는 버튼으로 보이도록 테두리·입체감·균등 폭 */
#thm{width:100%;justify-content:center;gap:6px;flex-wrap:wrap}
#nxs{gap:6px;flex-wrap:wrap}
/* 선택형 버튼(뷰 스타일·뷰에 보일 대기 곡 수) 공통 모양 */
#thm button,#nxs button{background:#454859;border:1px solid #666a80;box-shadow:0 2px 0 rgba(0,0,0,.35);font-weight:600;white-space:nowrap}
#thm button{flex:1 1 auto;min-width:0;padding:8px 8px}
#nxs button{padding:6px 12px}
#thm button:hover,#nxs button:hover{background:#565a70;border-color:#8a8ea6}
#thm button:active{transform:translateY(1px);box-shadow:none}
/* 선택된 버튼(초록): 정렬 버튼·칸 편집 포함 */
.seg button.on,#pedit.on,#thm button.on,#nxs button.on{background:#1fbf6b;color:#06210f;font-weight:700}
#thm button.on,#nxs button.on{border-color:#1fbf6b}
.sec{margin-top:8px;padding:10px 12px 12px;border:1px solid #2e303a;border-radius:10px}
.sec.hi{background:#303342;border-color:#3a3c4a}   /* 메인 타이틀 칸을 밝게 구분 */
.sec h3{margin:0;font-size:13px;font-weight:700;color:#c8cad4}
.sec h3 .sd{margin-right:8px;font-weight:400;font-size:12px;color:#8a8d9a}
#title{display:none;line-height:1.2;white-space:pre-wrap;word-break:break-all;font-size:calc(var(--tfs)*1px)}
body.control #title{font-size:max(14px,calc(var(--tfs)*.4px))}
#msg,#tt{flex:1;min-width:140px;padding:7px 8px;border-radius:8px;border:1px solid #3a3c46;background:#12131a;color:#fff;font:inherit}
input:disabled{opacity:.4;cursor:default}
input[type=color]{width:34px;height:26px;padding:0;border:0;background:none;cursor:pointer}
#head{--pl:calc(var(--cfs)*2.7 + 12px);--pr:calc(var(--cfs)*.9);display:none;margin:8px 8px 0;padding:10px var(--pr) 10px var(--pl);border-radius:14px;
  background:rgba(26,26,28,.90);border:1px solid rgba(255,255,255,.14)}
#head #title,#head #banner{padding:0;text-shadow:none}
#head #banner.sp{padding-bottom:4px}
body.control #head{--pl:10px;--pr:10px;margin:0 0 10px;padding:8px 10px}
/* 가운데정렬: 곡 카드 줄맞춤용 왼쪽 여백을 무시하고 카드 전체 폭 기준으로 가운데 */
#head #title.ctr,#head #banner.ctr{margin-left:calc(var(--pl)*-1);margin-right:calc(var(--pr)*-1);padding-left:var(--pr);padding-right:var(--pr)}
.fsel{background:#12131a;color:#fff;border:1px solid #3a3c46;border-radius:8px;padding:6px;font:inherit;max-width:240px}
.seg{display:flex;gap:2px}
.seg button{padding:5px 9px}
/* 글자색 버튼·팔레트 */
.cbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:#fff}
#pal{display:none;position:fixed;z-index:50;width:236px;padding:10px;border-radius:12px;background:#24262f;border:1px solid #4a4d5a;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#pal.open{display:block}
.pslots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pslot{width:100%;aspect-ratio:1;padding:0;border-radius:50%;border:2px solid #555}
.pslot.on{border-color:#fff}
#pal.edit .pslot{border:2px dashed #ffe14d}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.prow button{padding:5px 9px}
.phint{margin-top:8px;font-size:12px;color:#8a8d9a}

/* 상단 메시지 */
#banner{display:none;line-height:1.3;white-space:pre-wrap;word-break:break-all;font-size:calc(var(--mfs)*1px)}
body.control #banner{font-size:max(11px,calc(var(--mfs)*.4px))}

/* 목록 */
#list{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
body.view #list{padding:8px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:.55em .9em;border-radius:14px;
  background:rgba(26,26,28,.90);border:1px solid rgba(255,255,255,.14);font-size:var(--fs)}
body.control .card{font-size:15px}
.no{min-width:1.8em;font-weight:var(--w,700);color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--w,700);line-height:1.3}
.now{flex-direction:column;align-items:flex-start;gap:.4em;padding:.8em .9em}
.now .line{display:flex;align-items:center;gap:12px;width:100%}
.now .t{font-size:1.7em}
body.control .now .t{font-size:1em}
/* Now Playing 마퀴: 넘칠 때만 .run 적용 */
.mqt{display:inline-block;white-space:nowrap;vertical-align:top;will-change:transform}
.mqs{display:inline-block;vertical-align:top;padding-right:3em}
.mqt.run{animation:mq var(--mqd,10s) linear infinite}
@keyframes mq{0%,15%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.badge{font-size:.65em;font-weight:900;background:#14ed9f;color:#04251a;padding:.22em .75em;border-radius:6px}
/* NOW PLAYING 뱃지 이퀄라이저 (기본·소프트핑크·네온사인 공통): 막대 색은 뱃지 글자색을 그대로 사용.
   블랙레드·화이트레드·라벤더는 body.tk .badge 에서 --eq 를 --k-dot 색으로 지정 */
.badge::before{content:"";display:inline-block;width:1em;height:.9em;margin-right:.55em;vertical-align:-.08em;
  background:linear-gradient(var(--eq,currentColor) 0 0) 0 100%/22% 40% no-repeat,linear-gradient(var(--eq,currentColor) 0 0) 50% 100%/22% 85% no-repeat,linear-gradient(var(--eq,currentColor) 0 0) 100% 100%/22% 60% no-repeat;
  animation:keq 1.8s linear infinite}
/* NOW PLAYING 뱃지를 곡명 시작선에 맞춤: 번호 칸(.no min-width 1.8em, 카드 글자 기준) + 간격 12px. 뱃지는 .65em이라 나눠서 환산 */
.now .badge{margin-left:calc(1.8em / .65 + 12px)}
/* 뱃지 크기(.65em·굵기 900·패딩)는 전 스타일 공통. 기본·소프트핑크·네온사인은 여기에 자간 + 흰 테두리 링과 글로우를 추가
   (블랙레드·화이트레드·라벤더(.tk)는 자체 자간·글로우 사용) */
body:not(.tk) .badge{letter-spacing:.06em;box-shadow:0 0 0 1px rgba(255,255,255,.6),0 0 10px rgba(20,237,159,.7)}
.empty{color:rgba(255,255,255,.55);font-weight:600}
.done{opacity:.6}
.done .t{text-decoration:line-through}
/* 카드 버튼 · 인라인 수정 · 전환 효과 */
.del{background:none;color:#ff9a9a;padding:2px 6px;font-size:.9em}
.del:hover{background:rgba(255,255,255,.1)}
.edt,.skp{background:none;color:#c8cad4;padding:2px 6px;font-size:.9em}
.edt:hover,.skp:hover{background:rgba(255,255,255,.1)}
.skp:disabled:hover{background:none}
.edt svg,.skp svg{display:block;width:1.15em;height:1.15em}
.edt+.skp,.skp+.del,.edt+.del{margin-left:-10px}
.edit{flex:1;min-width:0;font:inherit;font-weight:var(--w,700);line-height:1.3;color:#fff;background:#12131a;border:1px solid #4da3ff;border-radius:6px;padding:.1em .4em}
.edit:focus{outline:none;border-color:#7fd6ff}
.done .edit{text-decoration:none}
.done.editing{opacity:1}
.now.swap > *{animation:nowin .4s ease-out}
@keyframes nowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grip{width:18px;height:14px;flex:none;cursor:grab;opacity:.7;
  background:linear-gradient(#fff 0 0) 0 0/100% 2px no-repeat,linear-gradient(#fff 0 0) 0 50%/100% 2px no-repeat,linear-gradient(#fff 0 0) 0 100%/100% 2px no-repeat}
.grip:hover{opacity:1}
/* 뷰 전용 요약 카드: 표시 개수를 넘는 대기 곡 */
.card.more{justify-content:center;font-size:calc(var(--fs)*.8);font-weight:700;color:rgba(255,255,255,.72);padding:.4em .9em}
/* 대기 곡 흐림 (Now Playing·부른 곡 제외) */
.card.wait{opacity:var(--wo,1)}
.card.wait.editing{opacity:1}
.card.wait.dragging{opacity:.35}
/* 드래그 삽입 위치: 모든 뷰 스타일에서 동일하게 보이는 안내선 */
#list .card.wait.before,#list .card.wait.after{outline:2px solid #7fd6ff;outline-offset:2px}
#list .card.wait.before::before,#list .card.wait.after::after{content:"여기에 놓기";position:absolute;z-index:5;left:12px;padding:1px 6px;border-radius:5px;background:#4da3ff;color:#07111d;font-size:11px;font-weight:800;line-height:16px;box-shadow:0 0 0 2px #07111d}
#list .card.wait.before::before{top:-11px}
#list .card.wait.after::after{bottom:-11px}

/* ===== 뷰 스타일: 소프트핑크 (body.glass) =====
   OBS 브라우저 소스는 뒤 배경을 흐릴 수 없어서 blur 대신 진한 반투명 배경(검정 90%)으로 가독성 확보 */
body.glass{--g-pink:#ff6fb5;--g-lav:#a99be8}
body.glass #head,body.glass .card{
  background:rgba(26,26,28,.90);
  border:1px solid rgba(169,155,232,.30);border-radius:16px}
body.glass .no{color:rgba(201,190,255,.78)}
body.glass .now .t{text-shadow:0 0 12px rgba(255,111,181,.55)}
body.glass .now .no{color:var(--g-pink)}
body.glass .badge{background:linear-gradient(90deg,var(--g-pink),var(--g-lav));color:#1a1030;letter-spacing:.06em;box-shadow:0 0 10px rgba(255,111,181,.7)}
body.glass .done{border-color:rgba(169,155,232,.15)}

/* ===== 뷰 스타일: 네온사인 (body.neon) ===== */
body.neon{--n-pink:#ff6fb5}
body.neon #stage{margin:8px;padding:12px;border-radius:26px;
  background:linear-gradient(145deg,#211735,#14101f 62%,#1b1230);
  /* 선 없이 글로우만: 뷰 여백(12px) 안에서 잘리지 않게 좁고 세게 + 안쪽 가장자리 글로우 */
  box-shadow:0 0 5px 1px rgba(190,175,255,.95),0 0 11px 2px rgba(169,155,232,.60),inset 0 0 6px rgba(190,175,255,.60),inset 0 0 20px rgba(169,155,232,.30)}
/* 뷰는 제어부보다 한 단계 넉넉하게: 카드와 네온 배경 테두리가 붙어 보이지 않도록 여백 확보 */
body.view.neon #stage{margin:12px;padding:26px}   /* 배경카드 안쪽 여백: 상하좌우 동일 */
body.control.neon #stage{margin:0}
body.neon #head,body.neon .card{
  background:linear-gradient(135deg,#2a1b47,#14101f 74%);
  border:1px solid rgba(169,155,232,.45);border-radius:12px;
  box-shadow:inset 0 0 12px rgba(169,155,232,.08)}
/* 타이틀 카드: 대기 곡보다 한 단계 또렷한 라벤더 (핑크는 Now Playing 전용) */
body.neon #head{border-color:rgba(169,155,232,.80);box-shadow:inset 0 0 14px rgba(169,155,232,.12),0 0 6px rgba(169,155,232,.28)}
body.neon #head{margin:0 0 10px}
/* 뷰 전용: 타이틀 카드를 위로 올리고, 나우 플레잉 카드의 네온 글로우와 겹치지 않게 간격 확보 */
body.view.neon #head{margin:0 0 26px;padding-top:18px;padding-bottom:18px}   /* 타이틀 카드 상하 여유 */
body.neon.view #list{padding:0}
body.neon .no{color:rgba(201,190,255,.88)}
body.neon .card.wait{box-shadow:inset 3px 0 0 rgba(169,155,232,.60),inset 0 0 10px rgba(169,155,232,.06)}
body.neon .done{border-color:rgba(169,155,232,.24)}
body.neon .now{border:2px solid var(--n-pink);background:linear-gradient(135deg,#4a1d5b,#1b1029 72%);
  box-shadow:0 0 0 2px var(--n-pink),0 0 10px 2px rgba(255,111,181,.92),0 0 24px 5px rgba(255,111,181,.43),inset 0 0 22px rgba(255,111,181,.18)}
body.view.neon .now{box-shadow:0 0 0 3px var(--n-pink),0 0 14px 3px rgba(255,111,181,.95),0 0 28px 6px rgba(255,111,181,.48),inset 0 0 22px rgba(255,111,181,.18)}
body.neon .now .t{text-shadow:0 0 9px rgba(255,255,255,.5),0 0 16px rgba(255,111,181,.72)}
body.neon .now .no{color:#ff8fc5;text-shadow:0 0 10px rgba(255,111,181,.9)}
body.neon .badge{background:linear-gradient(90deg,#ff6fb5,#a99be8);color:#14101f;letter-spacing:.06em;box-shadow:0 0 12px rgba(255,111,181,.95)}

/* ===== 뷰 스타일 3종 공통 (body.tk): 블랙레드 / 화이트레드 / 라벤더 =====
   색은 변수로만 바꾸고, 움직임(글로우 점멸·이퀄라이저)은 NOW PLAYING 카드에서만 사용 */
body.tk #head,body.tk .card{
  background:linear-gradient(135deg,var(--k-bg1),var(--k-bg2) 74%);
  border:1px solid var(--k-line);border-radius:14px}
body.view.tk #head{margin:16px 16px 0}
body.view.tk #list{padding:16px}   /* 글로우가 방송 화면 가장자리에서 잘리지 않도록 여백 확보 */
body.tk #head{border-color:var(--k-line2)}
body.tk .no{color:var(--k-no)}
/* 대기 곡: 차분하게 (글로우·움직임 없음, 왼쪽 가는 막대만) */
body.tk .card.wait{box-shadow:inset 3px 0 0 var(--k-bar)}
body.tk .card.wait .t{color:rgba(255,255,255,.88)}
body.tk .done{border-color:var(--k-line)}
body.tk .card.more{color:var(--k-no)}
/* NOW PLAYING: 가장 또렷하게 + 숨쉬듯 천천히 점멸하는 글로우 */
body.tk .now{overflow:hidden;border:2px solid var(--k-a);
  background:var(--k-nbg);
  box-shadow:0 0 0 1px rgba(var(--k-a-rgb),.30),0 0 9px 1px rgba(var(--k-a-rgb),.55),0 0 18px 3px rgba(var(--k-a-rgb),.22),inset 0 0 18px rgba(var(--k-a-rgb),.12);
  animation:kglow 3.8s ease-in-out infinite}
@keyframes kglow{
  0%,100%{box-shadow:0 0 0 1px rgba(var(--k-a-rgb),.30),0 0 9px 1px rgba(var(--k-a-rgb),.50),0 0 18px 3px rgba(var(--k-a-rgb),.18),inset 0 0 18px rgba(var(--k-a-rgb),.10)}
  50%{box-shadow:0 0 0 1px rgba(var(--k-a-rgb),.45),0 0 12px 2px rgba(var(--k-a-rgb),.85),0 0 24px 5px rgba(var(--k-a-rgb),.38),inset 0 0 24px rgba(var(--k-a-rgb),.20)}}
body.tk .now .t{text-shadow:0 0 10px rgba(var(--k-a-rgb),.55),0 0 2px rgba(255,255,255,.35)}
body.tk .now .no{color:var(--k-a);text-shadow:0 0 10px rgba(var(--k-a-rgb),.9)}
/* NOW PLAYING 뱃지: 이퀄라이저 막대(스포티파이·애플뮤직·유튜브뮤직 등의 "재생 중" 표시)가 오르내림 — 모양·움직임(keq)은 전 스타일 공통 */
body.tk .badge{--eq:var(--k-dot);background:var(--k-badge);color:var(--k-badge-fg);letter-spacing:.05em;box-shadow:0 0 8px rgba(var(--k-a-rgb),.6)}
/* 멈칫 없이 흐르도록: 구간마다 감속하지 않게 linear + 사인파로 촘촘히 샘플링한 키프레임 (3막대 박자 다름) */
@keyframes keq{
  0%{background-size:22% 62%,22% 97%,22% 34%}
  2.78%{background-size:22% 75%,22% 84%,22% 30%}
  5.56%{background-size:22% 87%,22% 66%,22% 27%}
  8.33%{background-size:22% 95%,22% 47%,22% 26%}
  11.11%{background-size:22% 99%,22% 32%,22% 25%}
  13.89%{background-size:22% 99%,22% 25%,22% 25%}
  16.67%{background-size:22% 95%,22% 28%,22% 27%}
  19.44%{background-size:22% 87%,22% 41%,22% 30%}
  22.22%{background-size:22% 75%,22% 59%,22% 33%}

   카드·배경을 모두 없애고 굵은 외곽선(검정) + 그림자로 어떤 배경에서도 읽히게 함. 글자 크기·여백은 다른 스타일과 같아서 타이틀 줄맞춤은 그대로.
   NOW SINGING 은 큰 글자 + 핑크 글로우 + 아래 핑크 밑줄 + 뱃지 이퀄라이저, 대기 곡은 차분하게(선명도 슬라이더 적용).
   외곽선 두께는 아래 .14em 숫자로 조절 (배경이 복잡하면 .18em 정도로) */

<script>
const K = 'setlist.v1', C = 'setlist.cfg', KH = 'setlist.h';   // KH: 되돌리기 기록 (곡 목록·설정과 따로 저장, 뷰는 읽지 않음)
const DEF_SW = ['#ffffff', '#ffe14d', '#ff8fb8', '#7fd6ff', '#8cf29a', '#ffab5e'];
const $ = id => document.getElementById(id);
const mode = new URLSearchParams(location.search).get('mode') === 'view' ? 'view' : 'control';
document.body.className = mode;

let S = { q: [], d: [], h: [] };   // q: 대기열(q[0]=Now Playing), d: 부른 곡, h: 되돌리기 기록
let cfg = { fs: 22, wo: 100, bo: 100, to: 100, hide: true, nx: 4, msg: '', mfs: 20, mb: false, mc: '#aeb1bd',
             tt: "Today's Setlist", tfs: 40, tb: true, tc: '#ffffff',
             ta: 'left', ma: 'left', tf: '', mf: '', lf: '', sw: DEF_SW.slice(), fold: false, theme: 'classic' };
let drag = -1, drop = -1, lastRaw = '';
let editId = null, editDraft = '', suppressBlur = false, lastNowId;
let listKey = '', lastFs, lastTheme;   // 목록 재생성 판단용

let lastK = '', lastC = '', lastH = '';   // 저장소에 마지막으로 쓴(읽은) 문자열: 바뀐 것만 다시 씀
function load() {
  let raw = '', craw = '';
  try {
    raw = localStorage.getItem(K) || '';
    craw = localStorage.getItem(C) || '';
    const s = JSON.parse(raw || 'null');
    const oldH = s && Array.isArray(s.h) ? s.h : [];   // 예전 형식(곡 목록 안에 기록 포함) 이어받기
    if (s && Array.isArray(s.q) && Array.isArray(s.d)) S = { q: s.q, d: s.d, h: mode === 'control' ? oldH : [] };
    else S = { q: [], d: [], h: [] };
    const c = JSON.parse(craw || 'null');
    if (c) cfg = { ...cfg, ...c };
    cfg.sw = DEF_SW.map((d, i) => {
      const v = (Array.isArray(cfg.sw) ? cfg.sw : [])[i];
      return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : d;
    });
    if (mode === 'control') {   // 되돌리기 기록은 컨트롤부만 읽음
      const hraw = localStorage.getItem(KH);
      if (hraw !== null) {
        const h = JSON.parse(hraw);
        if (Array.isArray(h)) { S.h = h; lastH = hraw; }
      }
    }
  } catch (e) {
  } finally {
    lastK = raw; lastC = craw;
    lastRaw = raw + '|' + craw;   // 파싱에 실패해도 갱신: sync()가 매초 다시 읽지 않도록
  }
}
function save() {
  try {
    const raw = JSON.stringify({ q: S.q, d: S.d }), craw = JSON.stringify(cfg);
    if (raw !== lastK) { localStorage.setItem(K, raw); lastK = raw; }
    if (craw !== lastC) { localStorage.setItem(C, craw); lastC = craw; }
    if (mode === 'control') {
      const hraw = JSON.stringify(S.h);
      if (hraw !== lastH) { localStorage.setItem(KH, hraw); lastH = hraw; }
    }
    lastRaw = raw + '|' + craw;
  } catch (e) {}
}
function commit(fn) {
  S.h.push(JSON.stringify({ q: S.q, d: S.d }));
  if (S.h.length > 30) S.h.shift();
  fn(); saveRender();
}
function saveRender() { save(); render(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const SVGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const ICO = {
  edit: SVGA + '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  skip: SVGA + '<path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>'
};
function iconBtn(cls, title, id, svg) {
  const b = el('button', cls); b.type = 'button'; b.title = title; b.dataset.id = id; b.innerHTML = svg;
  return b;
}
function delBtn(id) {
  const b = el('button', 'del', '✕'); b.title = '삭제'; b.dataset.id = id;
  return b;
}
function findSong(id) { return S.q.find(x => x.id === id) || S.d.find(x => x.id === id); }

/* 제목 인라인 수정: Enter 저장 · Esc 취소 · 다른 곳 클릭 시 저장 · 빈 제목이면 취소 */
function titleCell(song) {
  if (editId !== song.id) { const s = el('span', 't', song.t); s.title = song.t; return s; }
  const i = el('input', 't edit'); i.type = 'text'; i.value = editDraft;
  i.oninput = () => { editDraft = i.value; };
  i.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finishEdit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
  };
  i.onblur = () => { if (!suppressBlur) finishEdit(true); };
  return i;
}
function finishEdit(saveIt) {
  if (editId === null) return;
  const id = editId, txt = editDraft.trim(), song = findSong(id);
  editId = null; editDraft = '';
  if (saveIt && song && txt && txt !== song.t) commit(() => { song.t = txt; });
  else render();
}

function renderList() {
  const listEl = $('list');
  suppressBlur = true; listEl.textContent = ''; suppressBlur = false;
  applyFont(listEl, cfg.lf);
  const nd = S.d.length;

  // Now Playing
  const now = el('div', 'card now');
  if (S.q[0]) {
    const s0 = S.q[0], editing0 = editId === s0.id;
    now.appendChild(el('div', 'badge', 'NOW SINGING'));
    const line = el('div', 'line');
    let tc;
    if (editing0 || mode !== 'view') tc = titleCell(s0);   // 컨트롤부: 일반 텍스트(말줄임)
    else {
      tc = el('span', 't mq'); tc.dataset.t = s0.t;
      tc.appendChild(el('span', 'mqt', s0.t));
    }
    line.append(el('span', 'no', nd + 1), tc);
    if (mode !== 'view') {   // 뷰에서는 버튼을 만들지 않음
      const skp = iconBtn('skp', '맨 뒤로 보내기', s0.id, ICO.skip);
      skp.disabled = S.q.length < 2;
      line.append(iconBtn('edt', '제목 수정', s0.id, ICO.edit), skp, delBtn(s0.id));
    }
    now.appendChild(line);
    if (lastNowId !== undefined && lastNowId !== s0.id) now.classList.add('swap');
    lastNowId = s0.id;
  } else {
    now.appendChild(el('div', 'empty', S.d.length ? '모든 곡을 불렀어요' : '신청곡을 추가해 주세요'));
    lastNowId = null;
  }
  listEl.appendChild(now);

  // 대기 곡
  const lim = (mode === 'view' && cfg.nx > 0) ? cfg.nx : Infinity;   // 뷰에서만 표시 개수 제한
  const shown = Math.min(S.q.length - 1, lim);
  for (let i = 1; i <= shown; i++) {
    const w = S.q[i];
    const c = el('div', 'card wait' + (editId === w.id ? ' editing' : '')); c.dataset.i = i;
    c.append(el('span', 'no', nd + i + 1), titleCell(w));
    if (mode !== 'view') c.append(iconBtn('edt', '제목 수정', w.id, ICO.edit), delBtn(w.id), Object.assign(el('span', 'grip'), { title: '끌어서 순서 변경' }));
    listEl.appendChild(c);
  }
  if (S.q.length - 1 > shown) listEl.appendChild(el('div', 'card more', '외 ' + (S.q.length - 1 - shown) + '곡 대기 중'));

  // 부른 곡 (맨 아래, 이동 불가)
  if (!(mode === 'view' && cfg.hide)) {
    S.d.forEach((sg, j) => {
      const c = el('div', 'card done' + (editId === sg.id ? ' editing' : ''));
      c.append(el('span', 'no', j + 1), titleCell(sg));
      if (mode !== 'view') c.append(iconBtn('edt', '제목 수정', sg.id, ICO.edit), delBtn(sg.id));
      listEl.appendChild(c);
    });
  }

  const ei = listEl.querySelector('.edit');
  if (ei) { ei.focus(); const n = ei.value.length; ei.setSelectionRange(n, n); }
}

function render() {
  const THEMES = ['glass', 'neon', 'bred', 'lav', 'mono', 'kara'];
  const th = THEMES.includes(cfg.theme) ? cfg.theme : 'classic';
  THEMES.forEach(t => document.body.classList.toggle(t, th === t));
  document.body.classList.toggle('tk', th === 'bred' || th === 'lav' || th === 'mono');
  document.querySelectorAll('#thm button').forEach(b => b.classList.toggle('on', b.dataset.t === th));
  document.querySelectorAll('#nxs button').forEach(b => b.classList.toggle('on', +b.dataset.n === (cfg.nx || 0)));
  document.documentElement.style.setProperty('--fs', cfg.fs + 'px');
  document.documentElement.style.setProperty('--wo', (cfg.wo == null ? 100 : cfg.wo) / 100);
  document.documentElement.style.setProperty('--mfs', cfg.mfs);
  document.documentElement.style.setProperty('--tfs', cfg.tfs);
  const T = $('title');
  T.textContent = cfg.tt;
  T.style.display = cfg.tt ? 'block' : 'none';
  T.style.fontWeight = cfg.tb ? '800' : '400';
  T.style.color = cfg.tc;
  T.style.textAlign = cfg.ta;
  T.classList.toggle('ctr', cfg.ta === 'center');
  applyFont(T, cfg.tf);
  tbEl.disabled = WEB_NAMES.has(cfg.tf);
  document.querySelectorAll('#tal button').forEach(b => b.classList.toggle('on', b.dataset.a === cfg.ta));
  const B = $('banner');
  B.textContent = cfg.msg;
  B.style.display = cfg.msg ? 'block' : 'none';
  $('head').style.display = (cfg.tt || cfg.msg) ? 'block' : 'none';
  $('head').style.opacity = (cfg.to == null ? 100 : cfg.to) / 100;
  B.classList.toggle('sp', !!(cfg.tt && cfg.msg));
  B.style.fontWeight = cfg.mb ? '800' : '400';
  B.style.color = cfg.mc;
  B.style.opacity = (cfg.bo == null ? 100 : cfg.bo) / 100;
  B.style.textAlign = cfg.ma;
  B.classList.toggle('ctr', cfg.ma === 'center');
  applyFont(B, cfg.mf);
  mbEl.disabled = WEB_NAMES.has(cfg.mf);
  document.querySelectorAll('#mal button').forEach(b => b.classList.toggle('on', b.dataset.a === cfg.ma));
  // 목록은 곡·편집 상태·목록 폰트·숨김 설정이 바뀔 때만 다시 그림 (그 외 설정 변경 시 마퀴 유지)
  const key = JSON.stringify([S.q, S.d, editId, cfg.lf, cfg.hide, cfg.nx]);
  const rebuilt = key !== listKey;
  if (rebuilt) { listKey = key; renderList(); }

  $('next').disabled = !S.q.length;
  $('undo').disabled = !S.h.length;
  $('copy').disabled = !(S.d.length || S.q.length);
  $('panel').classList.toggle('fold', !!cfg.fold);
  $('foldst').textContent = cfg.fold ? '펼치기 ▾' : '접기 ▴';
  $('tcd').style.background = cfg.tc;
  $('mcd').style.background = cfg.mc;
  renderPal();
  if (rebuilt || cfg.fs !== lastFs || th !== lastTheme) { lastFs = cfg.fs; lastTheme = th; fitMarquee(); }
  fitView();
}

/* Now Playing 마퀴: 제목이 넘칠 때만 끊김 없이 흘러가게 함 */
const MQ_SPEED = 70;   // 초당 이동 px
function fitMarquee() {
  document.querySelectorAll('.mq').forEach(m => {
    const tr = m.firstChild, txt = m.dataset.t;
    tr.classList.remove('run');
    tr.textContent = txt;
    if (tr.offsetWidth > m.clientWidth + 1) {
      tr.textContent = '';
      tr.append(el('span', 'mqs', txt), el('span', 'mqs', txt));
      const unit = tr.firstChild.offsetWidth;
      tr.style.setProperty('--mqd', (unit / MQ_SPEED / 0.85).toFixed(2) + 's');
      tr.classList.add('run');
    }
  });
}
/* 뷰 자동 맞춤: 우선순위 NOW PLAYING > 대기 곡 > 부른 곡(오래된 것부터 생략).
   1) 내용이 창 높이를 넘으면 가장 오래된 '부른 곡'부터 숨김  2) 그래도 넘으면 #stage 를 통째로 축소 */
const FIT_MIN = 0.5;   // 최소 배율 (이보다 작게는 줄이지 않음)
let lastZoom = 1;
function fitView() {
  if (mode !== 'view') return;
  const st = $('stage');
  const dones = [...document.querySelectorAll('#list .card.done')];
  st.style.zoom = '';
  dones.forEach(c => c.style.display = '');
  const cs = getComputedStyle(st);
  const extra = parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
  const H = () => st.offsetHeight + extra;
  for (let i = 0; i < dones.length && H() > innerHeight; i++) dones[i].style.display = 'none';
  const h = H();
  const k = h > innerHeight ? Math.max(FIT_MIN, innerHeight / h) : 1;
  if (k < 1) st.style.zoom = k.toFixed(3);
  if (k !== lastZoom) { lastZoom = k; fitMarquee(); }
}
window.addEventListener('resize', () => { fitView(); fitMarquee(); closePal(); });   // 창 크기가 바뀌면 뷰 맞춤 + 열린 팔레트 닫기
if (document.fonts) document.fonts.addEventListener('loadingdone', () => { fitView(); fitMarquee(); });

/* 조작부 이벤트 */
function addSongs() {
  const ta = $('ta');
  const songs = ta.value.split(/\r?\n/)
    .map(l => l.trim().replace(/^\d+\s*[.)]\s*/, '').trim())
    .filter(Boolean);
  if (!songs.length) return;
  commit(() => songs.forEach(t => S.q.push({ id: uid(), t })));
  ta.value = '';
}
$('add').onclick = addSongs;
$('ta').addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter') addSongs();
});
$('next').onclick = () => {
  if (!S.q.length) return;
  commit(() => S.d.push(S.q.shift()));
};
$('undo').onclick = () => {
  if (!S.h.length) return;
  const p = JSON.parse(S.h.pop());
  S.q = p.q; S.d = p.d; saveRender();
};
/* 슬라이더·체크박스·글상자 ↔ cfg 연결 표: [요소 id, cfg 키, 종류]
   n: 숫자 슬라이더 · p: 퍼센트 슬라이더(값 표시칸 id = 요소 id + 'v') · c: 체크박스 · t: 글상자 */
const BIND = [
  ['fs', 'fs', 'n'], ['wo', 'wo', 'p'], ['bo', 'bo', 'p'], ['to', 'to', 'p'], ['hide', 'hide', 'c'],
  ['msg', 'msg', 't'], ['mfs', 'mfs', 'n'], ['mb', 'mb', 'c'],
  ['tt', 'tt', 't'], ['tfs', 'tfs', 'n'], ['tb', 'tb', 'c']
];
const mbEl = $('mb'), tbEl = $('tb');   // render() 가 폰트에 따라 굵게 칸을 잠글 때 사용
BIND.forEach(([id, key, kind]) => {
  const e = $(id);
  if (kind === 'c') e.onchange = () => { cfg[key] = e.checked; saveRender(); };
  else e.oninput = () => {
    cfg[key] = kind === 't' ? e.value : +e.value;
    if (kind === 'p') $(id + 'v').textContent = cfg[key] + '%';
    saveRender();
  };
});

[['tal', 'ta'], ['mal', 'ma']].forEach(([id, key]) => {
  [['left', '좌'], ['center', '중'], ['right', '우']].forEach(([v, label]) => {
    const b = el('button', '', label); b.dataset.a = v; b.title = label + ' 정렬';
    b.onclick = () => { cfg[key] = v; saveRender(); };
    $(id).appendChild(b);
  });
});

/* 뷰에 보일 대기 곡 수: 3 / 4 / 5 / 10 / 무제한(0) */
[[3, '3'], [4, '4'], [5, '5'], [10, '10'], [0, '무제한']].forEach(([v, label]) => {
  const b = el('button', '', label); b.type = 'button'; b.dataset.n = v; b.title = v ? '대기 곡 ' + v + '곡까지 표시' : '대기 곡 전부 표시';
  b.onclick = () => { cfg.nx = v; saveRender(); };
  $('nxs').appendChild(b);
});

/* 폰트 선택 */
const WEB_GROUPS = [
  ['나눔고딕', [['NanumGothicLight','가는'],['NanumGothic','보통'],['NanumGothicBold','굵게'],['NanumGothicExtraBold','아주 굵게']]],
  ['나눔바른고딕', [['NanumBarunGothicUltraLight','아주 가는'],['NanumBarunGothicLight','가는'],['NanumBarunGothic','보통'],['NanumBarunGothicBold','굵게']]],
  ['나눔스퀘어', [['NanumSquareLight','가는'],['NanumSquare','보통'],['NanumSquareBold','굵게'],['NanumSquareExtraBold','아주 굵게']]],
  ['나눔스퀘어 AC', [['NanumSquareAcl','가는'],['NanumSquareAcr','보통'],['NanumSquareAcb','굵게'],['NanumSquareAceb','아주 굵게']]],
  ['나눔스퀘어 네오', [['NanumSquareNeoLight','가는'],['NanumSquareNeo','보통'],['NanumSquareNeoBold','굵게'],['NanumSquareNeoExtraBold','아주 굵게'],['NanumSquareNeoHeavy','헤비']]],
  ['나눔스퀘어라운드', [['NanumSquareRoundLight','가는'],['NanumSquareRound','보통'],['NanumSquareRoundBold','굵게'],['NanumSquareRoundExtraBold','아주 굵게']]],
  ['마루 부리', [['MaruBuriExtraLight','아주 가는'],['MaruBuriLight','가는'],['MaruBuri','보통'],['MaruBuriSemiBold','약간 굵게'],['MaruBuriBold','굵게']]]
];
const WEB_NAMES = new Set(WEB_GROUPS.flatMap(g => g[1].map(i => i[0])));
const LOCAL_CANDIDATES = ['맑은 고딕', 'Noto Sans KR'];
function ff(n) { return n ? '"' + n.replace(/"/g, '') + '", sans-serif' : ''; }
function weightOf(n) {
  if (/(UltraLight|ExtraLight)$/.test(n)) return 200;
  if (/(Light|Acl)$/.test(n)) return 300;
  if (/SemiBold$/.test(n)) return 600;
  if (/(ExtraBold|Aceb)$/.test(n)) return 800;
  if (/Heavy$/.test(n)) return 900;
  if (/(Bold|Acb)$/.test(n)) return 700;
  return 400;
}
function applyFont(node, n) {
  const web = WEB_NAMES.has(n);
  node.style.fontFamily = ff(n);
  node.style.fontSynthesis = web ? 'none' : '';
  node.style.setProperty('--w', web ? weightOf(n) : '');
  if (web) node.style.fontWeight = weightOf(n);
}
function hasFont(n) {
  const c = hasFont.c || (hasFont.c = document.createElement('canvas').getContext('2d'));
  const s = 'mmmmmmmmmmlli한글あ';
  return ['monospace', 'serif', 'sans-serif'].some(base => {
    c.font = '72px ' + base; const w0 = c.measureText(s).width;
    c.font = '72px "' + n + '",' + base; return c.measureText(s).width !== w0;
  });
}
const localFonts = mode === 'control' ? LOCAL_CANDIDATES.filter(hasFont) : [];
const FKEYS = ['tf', 'mf', 'lf'];
function fillSelects() {
  if (mode !== 'control') return;
  FKEYS.forEach(key => {
    const sel = $(key);
    sel.textContent = '';
    const o0 = el('option', '', '기본 글꼴'); o0.value = ''; sel.appendChild(o0);
    WEB_GROUPS.forEach(([gname, items]) => {
      const og = el('optgroup'); og.label = gname;
      items.forEach(([fam, w]) => {
        const o = el('option', '', gname + ' ' + w); o.value = fam; og.appendChild(o);
      });
      sel.appendChild(og);
    });
    if (localFonts.length) {
      const og = el('optgroup'); og.label = '이 PC에 설치된 폰트';
      localFonts.forEach(n => {
        const o = el('option', '', n); o.value = n; o.style.fontFamily = ff(n); og.appendChild(o);
      });
      sel.appendChild(og);
    }
    if (cfg[key] && !WEB_NAMES.has(cfg[key]) && !localFonts.includes(cfg[key])) {
      const o = el('option', '', cfg[key]); o.value = cfg[key]; sel.appendChild(o);
    }
    sel.value = cfg[key];
  });
}
FKEYS.forEach(key => {
  $(key).onchange = e => { cfg[key] = e.target.value; saveRender(); };
});

let armTimer = 0;
const resetBtn = $('reset');
resetBtn.onclick = () => {
  if (!resetBtn.classList.contains('arm')) {
    resetBtn.classList.add('arm'); resetBtn.textContent = '정말 초기화? (다시 클릭)';
    armTimer = setTimeout(disarm, 3000); return;
  }
  disarm();
  commit(() => { S.q = []; S.d = []; });
};
function disarm() {
  clearTimeout(armTimer);
  resetBtn.classList.remove('arm'); resetBtn.textContent = '전체 초기화';
}

/* 삭제 */
$('list').addEventListener('click', e => {
  const b = e.target.closest('.del, .edt, .skp');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  if (b.classList.contains('del')) {
    if (editId === id) { editId = null; editDraft = ''; }
    commit(() => { S.q = S.q.filter(x => x.id !== id); S.d = S.d.filter(x => x.id !== id); });
  } else if (b.classList.contains('edt')) {
    const song = findSong(id);
    if (!song) return;
    editId = id; editDraft = song.t; render();
  } else if (S.q.length > 1 && S.q[0].id === id) {
    commit(() => { S.q.push(S.q.shift()); });
  }
});

/* 드래그로 순서 변경 (대기 곡만) */
const L = $('list');
function clearMarks() { L.querySelectorAll('.before,.after').forEach(n => n.classList.remove('before', 'after')); }
L.addEventListener('mousedown', e => {
  const g = e.target.closest('.grip');
  if (g) g.closest('.card').draggable = true;
});
document.addEventListener('mouseup', () => {
  L.querySelectorAll('.card[draggable="true"]').forEach(c => c.draggable = false);
});
L.addEventListener('dragstart', e => {
  const c = e.target.closest ? e.target.closest('.card.wait') : null;
  if (!c || !c.draggable) { e.preventDefault(); return; }
  drag = +c.dataset.i; drop = -1;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'song');
  c.classList.add('dragging');
});
L.addEventListener('dragover', e => {
  if (drag < 0) return;
  e.preventDefault();
  const c = e.target.closest('.card.wait');
  if (!c) return;
  clearMarks();
  const r = c.getBoundingClientRect(), i = +c.dataset.i;
  const before = e.clientY < r.top + r.height / 2;
  c.classList.add(before ? 'before' : 'after');
  drop = before ? i : i + 1;
});
L.addEventListener('drop', e => {
  if (drag < 0) return;
  e.preventDefault();
  let to = drop, from = drag;
  if (to >= 1) {
    if (to > from) to--;
    if (to !== from) commit(() => { const [x] = S.q.splice(from, 1); S.q.splice(to, 0, x); });
  }
});
L.addEventListener('dragend', () => { drag = -1; drop = -1; listKey = ''; render(); });

/* 동기화: storage 이벤트 + 1초 폴링(안전장치) */
function sync() {
  if (drag >= 0 || editId !== null) return;
  const raw = (localStorage.getItem(K) || '') + '|' + (localStorage.getItem(C) || '');
  if (raw !== lastRaw) { load(); syncControls(); render(); }
}
window.addEventListener('storage', sync);
setInterval(sync, 1000);

function syncControls() {
  BIND.forEach(([id, key, kind]) => {
    const e = $(id);
    if (kind === 'c') e.checked = cfg[key];
    else if (kind === 't') { if (document.activeElement !== e) e.value = cfg[key]; }   // 입력 중인 칸은 건드리지 않음
    else if (kind === 'p') { e.value = cfg[key] == null ? 100 : cfg[key]; $(id + 'v').textContent = e.value + '%'; }
    else e.value = cfg[key];
  });
  fillSelects();
}

/* 셋리스트 복사: 부른 곡 → 지금 곡 → 대기 곡 순서, "1. 곡명" 형식 */
function legacyCopy(t) {
  const a = document.createElement('textarea');
  a.value = t; a.setAttribute('readonly', '');
  a.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(a); a.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  a.remove();
  if (!ok) throw new Error('copy failed');
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).catch(() => legacyCopy(t));
  }
  try { legacyCopy(t); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
}
const copyBtn = $('copy');
let copyTimer = 0;
function flashCopy(msg) {
  clearTimeout(copyTimer);
  copyBtn.textContent = msg;
  copyTimer = setTimeout(() => { copyBtn.textContent = '셋리스트 복사'; }, 1500);
}
copyBtn.onclick = () => {
  const all = [...S.d, ...S.q];
  if (!all.length) return;
  copyText(all.map((s, i) => (i + 1) + '. ' + s.t).join('\n'))
    .then(() => flashCopy('복사됨!'), () => flashCopy('복사 실패'));
};

/* 글자색 팔레트: 6칸 공유, 적용은 제목/메시지 각각 */
const pal = $('pal'), pslots = $('pslots'),
      pcol = $('pcol'), pedit = $('pedit'),
      prst = $('prst'), phint = $('phint');
let palTarget = null, palEdit = false, prstTimer = 0;
function renderPal() {
  if (palTarget === null) return;
  const cur = cfg[palTarget].toLowerCase();
  pslots.textContent = '';
  cfg.sw.forEach((c, i) => {
    const b = el('button', 'pslot' + (c === cur ? ' on' : ''));
    b.type = 'button'; b.style.background = c; b.title = c; b.dataset.i = i;
    pslots.appendChild(b);
  });
  if (pcol.value !== cur) pcol.value = cur;
  pal.classList.toggle('edit', palEdit);
  pedit.classList.toggle('on', palEdit);
  phint.textContent = palEdit ? '바꿀 칸을 누르면 지금 색으로 교체돼요' : '칸을 누르면 색이 적용돼요';
}
function openPal(t, btn) {
  if (pal.classList.contains('open') && palTarget === t) { closePal(); return; }
  palTarget = t; palEdit = false;
  pal.classList.add('open'); renderPal();
  const r = btn.getBoundingClientRect(), w = pal.offsetWidth, h = pal.offsetHeight;
  const x = Math.min(Math.max(6, r.left), Math.max(6, innerWidth - w - 6));
  let y = r.bottom + 6;
  if (y + h > innerHeight - 6 && r.top - h - 6 >= 6) y = r.top - h - 6;
  pal.style.left = x + 'px'; pal.style.top = y + 'px';
}
function closePal() {
  pal.classList.remove('open'); palTarget = null; palEdit = false; disarmPrst();
}
function disarmPrst() {
  clearTimeout(prstTimer); delete prst.dataset.arm; prst.textContent = '기본색 복원';
}
$('tcb').onclick = e => openPal('tc', e.currentTarget);
$('mcb').onclick = e => openPal('mc', e.currentTarget);
pslots.onclick = e => {
  const b = e.target.closest('.pslot');
  if (!b || palTarget === null) return;
  const i = +b.dataset.i;
  if (palEdit) { cfg.sw[i] = cfg[palTarget].toLowerCase(); palEdit = false; }
  else cfg[palTarget] = cfg.sw[i];
  saveRender();
};
pcol.oninput = () => {
  if (palTarget === null) return;
  cfg[palTarget] = pcol.value; saveRender();
};
pedit.onclick = () => { palEdit = !palEdit; renderPal(); };
prst.onclick = () => {
  if (!prst.dataset.arm) {
    prst.dataset.arm = '1'; prst.textContent = '한 번 더 누르면 복원';
    prstTimer = setTimeout(disarmPrst, 3000); return;
  }
  disarmPrst(); cfg.sw = DEF_SW.slice(); saveRender();
};
document.addEventListener('mousedown', e => {
  if (pal.classList.contains('open') && !e.target.closest('#pal, .cbtn')) closePal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePal(); });
window.addEventListener('scroll', closePal, true);

document.querySelectorAll('#thm button').forEach(b => { b.onclick = () => { cfg.theme = b.dataset.t; saveRender(); }; });
$('fold').onclick = () => { cfg.fold = !cfg.fold; closePal(); saveRender(); };

load(); syncControls(); render();
</script>
</body>
