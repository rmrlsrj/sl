<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>셋리스트</title>
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-gothic.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-barun-gothic.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-round.css" rel="stylesheet">
<link href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css" rel="stylesheet">
<style>
:root{--fs:22px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:#fff}
body{--cfs:var(--fs)}   /* 곡 카드 글자 크기: 타이틀 줄맞춤 계산용 */
body.control{--cfs:15px}
body.view{background:transparent;overflow:hidden}
body.control{background:#1c1d23;font-size:14px;padding:10px}
body.view #panel,body.view #dock,body.view .foot{display:none}

/* 조작부 */
#panel{margin-bottom:0}
#ta{display:block;width:100%;height:64px;resize:none;padding:8px 86px 8px 8px;border-radius:8px;border:1px solid #e3cf83;background:#fff4c7;color:#2a2618;font:inherit}
#ta::placeholder{color:#8a826a}
/* 상단 고정: 입력칸(추가 버튼 내장) + 다음/완료 */
#dock{position:sticky;top:0;z-index:20;margin:0 -10px 10px;padding:10px 10px 8px;background:#1c1d23;border-bottom:1px solid #33353f}
.addbox{position:relative}
#add{position:absolute;right:20px;bottom:8px;padding:6px 14px}
.act{flex-wrap:nowrap}
.act .big{flex:1;padding:12px 14px;font-size:17px}
.act .sub{padding:12px 14px}
.foot{margin-top:12px}
button.ghost{background:none;border:1px solid #3a3c46;color:#c8cad4;padding:5px 10px;font-size:13px}
button.ghost:hover{background:rgba(255,255,255,.08)}
#ta:focus{outline:2px solid #e0b93a;outline-offset:0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:7px 12px;background:#33353f;color:#fff}
button:hover{background:#40424e}
button:disabled{opacity:.4;cursor:default}
button.main{background:#1fbf6b;color:#06210f;font-weight:700}
button.main:hover{background:#27d377}
button.danger.arm{background:#c0392b}
label{display:flex;align-items:center;gap:6px;color:#c8cad4}
.hint{color:#8a8d9a;font-size:12px;margin-top:6px}
/* 설정 묶음 (접기) */
#fold{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-weight:700}
#fold .st{font-weight:400;color:#8a8d9a;font-size:12px}
#panel.fold #settings{display:none}
#settings{margin-top:4px}
.sec{margin-top:8px;padding:10px 12px 12px;border:1px solid #2e303a;border-radius:10px}
.sec:first-child{margin-top:6px}
.sec:nth-of-type(2){background:#272935;border-color:#3a3c4a}   /* 가운데(메인 타이틀) 칸만 살짝 옅게 */
.sec h3{margin:0;font-size:13px;font-weight:700;color:#c8cad4}
.sec h3 .sd{margin-right:8px;font-weight:400;font-size:12px;color:#8a8d9a}
#title{display:none;padding:8px 10px 0;line-height:1.2;white-space:pre-wrap;word-break:break-all;
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);font-size:calc(var(--tfs)*1px)}
body.control #title{font-size:max(14px,calc(var(--tfs)*.4px));padding:2px 2px 6px}
#msg,#tt{flex:1;min-width:140px;padding:7px 8px;border-radius:8px;border:1px solid #3a3c46;background:#12131a;color:#fff;font:inherit}
input:disabled{opacity:.4;cursor:default}
input[type=color]{width:34px;height:26px;padding:0;border:0;background:none;cursor:pointer}
#head{--pl:calc(var(--cfs)*2.7 + 12px);--pr:calc(var(--cfs)*.9);display:none;margin:8px 8px 0;padding:10px var(--pr) 10px var(--pl);border-radius:14px;
  background:rgba(26,26,28,.90);border:1px solid rgba(255,255,255,.14)}
#head #title,#head #banner{padding:0;text-shadow:none}
#head #banner.sp{padding-bottom:4px}
body.control #head{--pl:10px;--pr:10px;margin:0 0 10px;padding:8px 10px}
/* 가운데정렬: 곡 카드 줄맞춤용 왼쪽 여백을 무시하고 카드 전체 폭 기준으로 가운데 */
#head #title.ctr,#head #banner.ctr{margin-left:calc(var(--pl)*-1);margin-right:calc(var(--pr)*-1);padding-left:var(--pr);padding-right:var(--pr)}
.fsel{background:#12131a;color:#fff;border:1px solid #3a3c46;border-radius:8px;padding:6px;font:inherit;max-width:240px}
.seg{display:flex;gap:2px}
.seg button{padding:5px 9px}
.seg button.on{background:#1fbf6b;color:#06210f;font-weight:700}
.sep{border:0;border-top:1px solid #33353f;margin:12px 0 4px}
/* 글자색 버튼·팔레트 */
.cbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:#fff}
#pal{display:none;position:fixed;z-index:50;width:236px;padding:10px;border-radius:12px;background:#24262f;border:1px solid #4a4d5a;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#pal.open{display:block}
.pslots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pslot{width:100%;aspect-ratio:1;padding:0;border-radius:50%;border:2px solid #555}
.pslot.on{border-color:#fff}
#pal.edit .pslot{border:2px dashed #ffe14d}
.prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.prow button{padding:5px 9px}
#pedit.on{background:#1fbf6b;color:#06210f;font-weight:700}
.phint{margin-top:8px;font-size:12px;color:#8a8d9a}

/* 상단 메시지 */
#banner{display:none;padding:8px 10px 0;line-height:1.3;white-space:pre-wrap;word-break:break-all;
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);font-size:calc(var(--mfs)*1px)}
body.control #banner{font-size:max(11px,calc(var(--mfs)*.4px));padding:2px 2px 8px}

/* 목록 */
#list{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
body.view #list{padding:8px}
.card{position:relative;display:flex;align-items:center;gap:12px;padding:.55em .9em;border-radius:14px;
  background:rgba(26,26,28,.90);border:1px solid rgba(255,255,255,.14);font-size:var(--fs)}
body.control .card{font-size:15px}
.no{min-width:1.8em;font-weight:var(--w,700);color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--w,700);line-height:1.3}
.now{flex-direction:column;align-items:flex-start;gap:.4em;padding:.8em .9em}
.now .line{display:flex;align-items:center;gap:12px;width:100%}
.now .t{font-size:1.7em}
body.control .now .t{font-size:1em}
/* Now Playing 마퀴: 넘칠 때만 .run 적용 */
.mqt{display:inline-block;white-space:nowrap;vertical-align:top;will-change:transform}
.mqs{display:inline-block;vertical-align:top;padding-right:3em}
.mqt.run{animation:mq var(--mqd,10s) linear infinite}
@keyframes mq{0%,15%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.badge{font-size:.55em;font-weight:800;background:#14ed9f;color:#04251a;padding:.2em .7em;border-radius:6px}
/* NOW PLAYING 뱃지를 곡명 시작선에 맞춤: 번호 칸(.no min-width 1.8em, 카드 글자 기준) + 간격 12px. 뱃지는 .55em이라 나눠서 환산 */
.now .badge{margin-left:calc(1.8em / .55 + 12px)}
.empty{color:rgba(255,255,255,.55);font-weight:600}
.done{opacity:.6}
.done .t{text-decoration:line-through}
/* 카드 버튼 · 인라인 수정 · 전환 효과 */
.del{background:none;color:#ff9a9a;padding:2px 6px;font-size:.9em}
.del:hover{background:rgba(255,255,255,.1)}
.edt,.skp{background:none;color:#c8cad4;padding:2px 6px;font-size:.9em}
.edt:hover,.skp:hover{background:rgba(255,255,255,.1)}
.skp:disabled:hover{background:none}
.edt svg,.skp svg{display:block;width:1.15em;height:1.15em}
.edt+.skp,.skp+.del,.edt+.del{margin-left:-10px}
.edit{flex:1;min-width:0;font:inherit;font-weight:var(--w,700);line-height:1.3;color:#fff;background:#12131a;border:1px solid #4da3ff;border-radius:6px;padding:.1em .4em}
.edit:focus{outline:none;border-color:#7fd6ff}
.done .edit{text-decoration:none}
.done.editing{opacity:1}
.now.swap > *{animation:nowin .4s ease-out}
@keyframes nowin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grip{width:18px;height:14px;flex:none;cursor:grab;opacity:.7;
  background:linear-gradient(#fff 0 0) 0 0/100% 2px no-repeat,linear-gradient(#fff 0 0) 0 50%/100% 2px no-repeat,linear-gradient(#fff 0 0) 0 100%/100% 2px no-repeat}
.grip:hover{opacity:1}
body.view .del,body.view .edt,body.view .skp,body.view .grip{display:none}
.dragging{opacity:.35}
/* 대기 곡 흐림 (Now Playing·부른 곡 제외) */
.card.wait{opacity:var(--wo,1)}
.card.wait.editing{opacity:1}
.card.wait.dragging{opacity:.35}
.wait.before{box-shadow:0 -4px 0 0 #4da3ff}
.wait.after{box-shadow:0 4px 0 0 #4da3ff}

/* ===== 뷰 스타일: 글래스 ♥ (body.glass) =====
   OBS 브라우저 소스는 뒤 배경을 흐릴 수 없어서 blur 대신 진한 반투명 보라로 가독성 확보 */
body.glass{--g-pink:#ff6fb5;--g-lav:#a99be8}
body.glass #head,body.glass .card{
  background:linear-gradient(135deg,#2a1d52,#150f2c);   /* 불투명: 제어부와 같은 느낌을 어떤 배경 위에서도 유지 */
  border:1px solid rgba(169,155,232,.30);border-radius:16px}
body.glass .no{color:rgba(201,190,255,.78)}
/* 현재 곡: 핑크 네온 테두리 + 글로우 */
/* 뷰는 목록 바깥 여백이 8px뿐이고 overflow:hidden이라 18px 글로우가 잘림 → 번지는 범위를 8px 안으로 줄이고,
   밝은 배경에서도 보이도록 번짐 대신 2px 단색 링으로 존재감을 줌 */
body.glass .now{border-color:#ff6fb5;background:linear-gradient(135deg,#40205c,#1d0f33);
  box-shadow:0 0 0 2px #ff6fb5,0 0 6px 2px rgba(255,111,181,.65),inset 0 0 20px rgba(255,111,181,.16)}
body.glass .now .t{text-shadow:0 0 12px rgba(255,111,181,.55)}
body.glass .now .no{color:var(--g-pink)}
/* 하트 뱃지 (곡명 시작선 정렬은 기존 .now .badge 규칙 그대로) */
body.glass .badge{background:linear-gradient(90deg,var(--g-pink),var(--g-lav));color:#1a1030;letter-spacing:.02em}
body.glass .badge::before{content:"\2665";margin-right:.4em}
/* 대기 곡: 왼쪽 라벤더 띠 (box-shadow는 드래그 표시선이 쓰므로 border로 처리) */
body.glass .card.wait{border-left:3px solid rgba(169,155,232,.60)}
body.glass .done{border-color:rgba(169,155,232,.15)}
/* 전체를 덮는 불투명 배경 패널(#stage): 어떤 씬 위에서도 제어부처럼 어두운 바탕 → 네온 글로우가 살아남 */
body.glass #stage{margin:8px;padding:14px;border-radius:22px;
  background:linear-gradient(160deg,rgba(31,18,64,.78),rgba(15,10,32,.74));
  border:1px solid rgba(169,155,232,.35);
  box-shadow:0 0 0 1px rgba(255,111,181,.18),0 6px 24px rgba(0,0,0,.45)}
body.control.glass #stage{margin:0}
body.glass #head{margin:0 0 10px}
body.glass.view #list{padding:0}
body.glass .now{box-shadow:0 0 0 2px #ff6fb5,0 0 12px 2px rgba(255,111,181,.60),inset 0 0 20px rgba(255,111,181,.16)}

/* ===== 뷰 스타일: 보라글래스 (body.glassy) = 1.2.3 반투명 보라, 현재 곡 테두리·글로우 없음 ===== */
body.glassy{--g-pink:#ff6fb5;--g-lav:#a99be8}
body.glassy #head,body.glassy .card{
  background:linear-gradient(135deg,rgba(38,26,74,.90),rgba(20,14,40,.90));
  border:1px solid rgba(169,155,232,.30);border-radius:16px}
body.glassy .no{color:rgba(201,190,255,.78)}
body.glassy .now .t{text-shadow:0 0 12px rgba(255,111,181,.55)}
body.glassy .now .no{color:var(--g-pink)}
body.glassy .badge{background:linear-gradient(90deg,var(--g-pink),var(--g-lav));color:#1a1030;letter-spacing:.02em}
body.glassy .badge::before{content:"\2665";margin-right:.4em}
body.glassy .done{border-color:rgba(169,155,232,.15)}
</style>
</head>
<body>

<div id="panel">
  <button id="fold" type="button" title="서브 타이틀·메인 타이틀·곡 리스트 설정 접기/펼치기"><span>설정</span><span class="st" id="foldst">접기 ▴</span></button>
  <div id="settings">
    <div class="row" style="margin-top:6px">
      <span style="font-weight:700;font-size:13px;color:#c8cad4">뷰 스타일</span>
      <span class="seg" id="thm">
        <button type="button" data-t="classic">기본</button>
        <button type="button" data-t="glass">글래스1</button>
        <button type="button" data-t="glassy">글래스2</button>
      </span>
    </div>
    <section class="sec">
      <h3><span class="sd">첫째 줄</span>서브 타이틀</h3>
      <div class="row"><input id="msg" type="text" placeholder="서브 타이틀 (예: 한식 노래방~)"></div>
      <div class="row">
        <label>크기 <input id="mfs" type="range" min="14" max="72"></label>
        <label><input id="mb" type="checkbox"> 굵게</label>
        <button id="mcb" class="cbtn" type="button" title="글자색"><i class="cdot" id="mcd"></i>글자색</button>
        <span class="seg" id="mal"></span>
      </div>
      <div class="row"><label>폰트 <select id="mf" class="fsel"></select></label></div>
      <div class="row"><label>서브 글자 선명도 <input id="bo" type="range" min="20" max="100" step="5"> <span id="bov" style="min-width:3em;color:#8a8d9a">100%</span></label></div>
    </section>
    <section class="sec">
      <h3><span class="sd">둘째 줄</span>메인 타이틀</h3>
      <div class="row"><input id="tt" type="text" placeholder="메인 타이틀 (비우면 숨김)"></div>
      <div class="row">
        <label>크기 <input id="tfs" type="range" min="14" max="80"></label>
        <label><input id="tb" type="checkbox"> 굵게</label>
        <button id="tcb" class="cbtn" type="button" title="글자색"><i class="cdot" id="tcd"></i>글자색</button>
        <span class="seg" id="tal"></span>
      </div>
      <div class="row"><label>폰트 <select id="tf" class="fsel"></select></label></div>
      <div class="row"><label>타이틀 카드 선명도 <input id="to" type="range" min="20" max="100" step="5"> <span id="tov" style="min-width:3em;color:#8a8d9a">100%</span></label></div>
    </section>
    <section class="sec">
      <h3>곡 리스트</h3>
      <div class="row"><label>크기 <input id="fs" type="range" min="14" max="44" step="1"></label></div>
      <div class="row"><label>대기 곡 선명도 <input id="wo" type="range" min="20" max="100" step="5"> <span id="wov" style="min-width:3em;color:#8a8d9a">100%</span></label></div>
      <div class="row"><label>폰트 <select id="lf" class="fsel"></select></label></div>
      <div class="row">
        <label><input id="hide" type="checkbox"> 부른 곡 숨기기(방송)</label>
        <button id="reset" class="danger">전체 초기화</button>
      </div>
    </section>
    <div class="hint">대기 곡은 오른쪽 ≡를 잡고 끌어서 순서 변경</div>
  </div>
</div>

<div id="dock">
  <div class="addbox">
    <textarea id="ta" placeholder="신청곡 붙여넣기 (한 줄에 한 곡, Ctrl+Enter로 추가)"></textarea>
    <button id="add" class="main">추가</button>
  </div>
  <div class="row act">
    <button id="next" class="main big">다음 / 완료</button>
    <button id="undo" class="sub">되돌리기</button>
  </div>
</div>

<div id="stage">
<div id="head">
  <div id="banner"></div>
  <div id="title"></div>
</div>
<div id="list"></div>
</div>
<div class="row foot"><button id="copy" class="ghost">셋리스트 복사</button></div>

<div id="pal">
  <div class="pslots" id="pslots"></div>
  <div class="prow">
    <label title="직접 고르기">직접 <input id="pcol" type="color"></label>
    <button id="pedit" type="button">칸 편집</button>
    <button id="prst" type="button">기본색 복원</button>
  </div>
  <div class="phint" id="phint"></div>
</div>

<script>
const K = 'setlist.v1', C = 'setlist.cfg';
const DEF_SW = ['#ffffff', '#ffe14d', '#ff8fb8', '#7fd6ff', '#8cf29a', '#ffab5e'];
const $ = id => document.getElementById(id);
const mode = new URLSearchParams(location.search).get('mode') === 'view' ? 'view' : 'control';
document.body.className = mode;

let S = { q: [], d: [], h: [] };   // q: 대기열(q[0]=Now Playing), d: 부른 곡, h: 되돌리기 기록
let cfg = { fs: 22, wo: 100, bo: 100, to: 100, hide: false, msg: '', mfs: 20, mb: false, mc: '#aeb1bd',
             tt: "Today's Setlist", tfs: 40, tb: true, tc: '#ffffff',
             ta: 'left', ma: 'left', tf: '', mf: '', lf: '', sw: DEF_SW.slice(), fold: false, theme: 'classic' };
let drag = -1, drop = -1, lastRaw = '';
let editId = null, editDraft = '', suppressBlur = false, lastNowId;
let listKey = '', lastFs;   // 목록 재생성 판단용

function load() {
  try {
    const raw = localStorage.getItem(K) || '';
    const s = JSON.parse(raw || 'null');
    if (s && Array.isArray(s.q) && Array.isArray(s.d)) S = { q: s.q, d: s.d, h: s.h || [] };
    else S = { q: [], d: [], h: [] };
    const craw = localStorage.getItem(C) || '';
    const c = JSON.parse(craw || 'null');
    if (c) cfg = { ...cfg, ...c };
    cfg.sw = DEF_SW.map((d, i) => {
      const v = (Array.isArray(cfg.sw) ? cfg.sw : [])[i];
      return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v) ? v.toLowerCase() : d;
    });
    lastRaw = raw + '|' + craw;
  } catch (e) {}
}
function save() {
  try {
    const raw = JSON.stringify(S), craw = JSON.stringify(cfg);
    localStorage.setItem(K, raw);
    localStorage.setItem(C, craw);
    lastRaw = raw + '|' + craw;
  } catch (e) {}
}
function commit(fn) {
  S.h.push(JSON.stringify({ q: S.q, d: S.d }));
  if (S.h.length > 30) S.h.shift();
  fn(); saveRender();
}
function saveRender() { save(); render(); }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

const SVGA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const ICO = {

function iconBtn(cls, title, id, svg) {

}
function delBtn(id) {

/* 제목 인라인 수정: Enter 저장 · Esc 취소 · 다른 곳 클릭 시 저장 · 빈 제목이면 취소 */
function titleCell(song) {
  if (editId !== song.id) { const s = el('span', 't', song.t); s.title = song.t; return s; }
  const i = el('input', 't edit'); i.type = 'text'; i.value = editDraft;
  i.oninput = () => { editDraft = i.value; };
  i.onkeydown = e => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); finishEdit(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finishEdit(false); }
  };
  i.onblur = () => { if (!suppressBlur) finishEdit(true); };
  return i;
}
function finishEdit(saveIt) {
  if (editId === null) return;
  const id = editId, txt = editDraft.trim(), song = findSong(id);
  editId = null; editDraft = '';
  if (saveIt && song && txt && txt !== song.t) commit(() => { song.t = txt; });
  else render();
}

function renderList() {
  const L = $('list');
  suppressBlur = true; L.textContent = ''; suppressBlur = false;
  applyFont(L, cfg.lf);
  const nd = S.d.length;

  // Now Playing
  const now = el('div', 'card now');
  if (S.q[0]) {
    const s0 = S.q[0], editing0 = editId === s0.id;
    if (editing0) now.classList.add('editing');
    now.appendChild(el('div', 'badge', 'NOW PLAYING'));
    const line = el('div', 'line');
    let tc;
    if (editing0 || mode !== 'view') tc = titleCell(s0);   // 컨트롤부: 일반 텍스트(말줄임)
    else {
      tc = el('span', 't mq'); tc.dataset.t = s0.t;
      tc.appendChild(el('span', 'mqt', s0.t));
    }
    const skp = iconBtn('skp', '맨 뒤로 보내기', s0.id, ICO.skip);
    skp.disabled = S.q.length < 2;
    line.append(el('span', 'no', nd + 1), tc, iconBtn('edt', '제목 수정', s0.id, ICO.edit), skp, delBtn(s0.id));
    now.appendChild(line);
    if (lastNowId !== undefined && lastNowId !== s0.id) now.classList.add('swap');
    lastNowId = s0.id;
  } else {
    now.appendChild(el('div', 'empty', S.d.length ? '모든 곡을 불렀어요' : '신청곡을 추가해 주세요'));
    lastNowId = null;
  }
  L.appendChild(now);

  // 대기 곡
  for (let i = 1; i < S.q.length; i++) {
    const w = S.q[i];

    c.append(el('span', 'no', nd + i + 1), titleCell(w), iconBtn('edt', '제목 수정', w.id, ICO.edit), delBtn(w.id), Object.assign(el('span', 'grip'), { title: '끌어서 순서 변경' }));
    L.appendChild(c);
  }

  // 부른 곡 (맨 아래, 이동 불가)

    S.d.forEach((sg, j) => {

      c.append(el('span', 'no', j + 1), titleCell(sg), iconBtn('edt', '제목 수정', sg.id, ICO.edit), delBtn(sg.id));
      L.appendChild(c);
    });
  }

  const ei = L.querySelector('.edit');
  if (ei) { ei.focus(); const n = ei.value.length; ei.setSelectionRange(n, n); }
}

const MQ_SPEED = 70;   // 초당 이동 px
function fitMarquee() {
  document.querySelectorAll('.mq').forEach(m => {
    const tr = m.firstChild, txt = m.dataset.t;
    tr.classList.remove('run');
    tr.textContent = txt;
    if (tr.offsetWidth > m.clientWidth + 1) {
      tr.textContent = '';
      tr.append(el('span', 'mqs', txt), el('span', 'mqs', txt));
      const unit = tr.firstChild.offsetWidth;
      tr.style.setProperty('--mqd', (unit / MQ_SPEED / 0.85).toFixed(2) + 's');
      tr.classList.add('run');
    }
  });
}
window.addEventListener('resize', fitMarquee);
if (document.fonts) {
  document.fonts.ready.then(fitMarquee);
  document.fonts.addEventListener('loadingdone', fitMarquee);
}

const WEB_GROUPS = [
  ['나눔고딕', [['NanumGothicLight','가는'],['NanumGothic','보통'],['NanumGothicBold','굵게'],['NanumGothicExtraBold','아주 굵게']]],

  ['나눔스퀘어', [['NanumSquareLight','가는'],['NanumSquare','보통'],['NanumSquareBold','굵게'],['NanumSquareExtraBold','아주 굵게']]],
  ['나눔스퀘어 AC', [['NanumSquareAcl','가는'],['NanumSquareAcr','보통'],['NanumSquareAcb','굵게'],['NanumSquareAceb','아주 굵게']]],
  ['나눔스퀘어 네오', [['NanumSquareNeoLight','가는'],['NanumSquareNeo','보통'],['NanumSquareNeoBold','굵게'],['NanumSquareNeoExtraBold','아주 굵게'],['NanumSquareNeoHeavy','헤비']]],
  ['나눔스퀘어라운드', [['NanumSquareRoundLight','가는'],['NanumSquareRound','보통'],['NanumSquareRoundBold','굵게'],['NanumSquareRoundExtraBold','아주 굵게']]],
  ['마루 부리', [['MaruBuriExtraLight','아주 가는'],['MaruBuriLight','가는'],['MaruBuri','보통'],['MaruBuriSemiBold','약간 굵게'],['MaruBuriBold','굵게']]]
];
const WEB_NAMES = new Set(WEB_GROUPS.flatMap(g => g[1].map(i => i[0])));
const LOCAL_CANDIDATES = ['맑은 고딕', 'Noto Sans KR'];
function ff(n) { return n ? '"' + n.replace(/"/g, '') + '", sans-serif' : ''; }
function weightOf(n) {
  if (/(UltraLight|ExtraLight)$/.test(n)) return 200;
  if (/(Light|Acl)$/.test(n)) return 300;
  if (/SemiBold$/.test(n)) return 600;
  if (/(ExtraBold|Aceb)$/.test(n)) return 800;
  if (/Heavy$/.test(n)) return 900;
  if (/(Bold|Acb)$/.test(n)) return 700;
  return 400;
}
function applyFont(node, n) {
  const web = WEB_NAMES.has(n);
  node.style.fontFamily = ff(n);
  node.style.fontSynthesis = web ? 'none' : '';
  node.style.setProperty('--w', web ? weightOf(n) : '');
  if (web) node.style.fontWeight = weightOf(n);
}
function hasFont(n) {
  const c = hasFont.c || (hasFont.c = document.createElement('canvas').getContext('2d'));
  const s = 'mmmmmmmmmmlli한글あ';
  return ['monospace', 'serif', 'sans-serif'].some(base => {
    c.font = '72px ' + base; const w0 = c.measureText(s).width;
    c.font = '72px "' + n + '",' + base; return c.measureText(s).width !== w0;
  });
}
const localFonts = mode === 'control' ? LOCAL_CANDIDATES.filter(hasFont) : [];
const FKEYS = ['tf', 'mf', 'lf'];
function fillSelects() {
  if (mode !== 'control') return;
  FKEYS.forEach(key => {
    const sel = $(key);
    sel.textContent = '';
    const o0 = el('option', '', '기본 글꼴'); o0.value = ''; sel.appendChild(o0);
    WEB_GROUPS.forEach(([gname, items]) => {
      const og = el('optgroup'); og.label = gname;
      items.forEach(([fam, w]) => {
        const o = el('option', '', gname + ' ' + w); o.value = fam; og.appendChild(o);
      });
      sel.appendChild(og);
    });
    if (localFonts.length) {
      const og = el('optgroup'); og.label = '이 PC에 설치된 폰트';
      localFonts.forEach(n => {
        const o = el('option', '', n); o.value = n; o.style.fontFamily = ff(n); og.appendChild(o);
      });
      sel.appendChild(og);
    }
    if (cfg[key] && !WEB_NAMES.has(cfg[key]) && !localFonts.includes(cfg[key])) {
      const o = el('option', '', cfg[key]); o.value = cfg[key]; sel.appendChild(o);
    }
    sel.value = cfg[key];
  });
}
FKEYS.forEach(key => {
  $(key).onchange = e => { cfg[key] = e.target.value; saveRender(); };
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('.del, .edt, .skp');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  if (b.classList.contains('del')) {
    if (editId === id) { editId = null; editDraft = ''; }
    commit(() => { S.q = S.q.filter(x => x.id !== id); S.d = S.d.filter(x => x.id !== id); });
  } else if (b.classList.contains('edt')) {
    const song = findSong(id);
    if (!song) return;
    editId = id; editDraft = song.t; render();
  } else if (S.q.length > 1 && S.q[0].id === id) {
    commit(() => { S.q.push(S.q.shift()); });
  }
});

/* 드래그로 순서 변경 (대기 곡만) */
const L = $('list');
function clearMarks() { L.querySelectorAll('.before,.after').forEach(n => n.classList.remove('before', 'after')); }
L.addEventListener('mousedown', e => {
  const g = e.target.closest('.grip');
  if (g) g.closest('.card').draggable = true;
});
document.addEventListener('mouseup', () => {
  L.querySelectorAll('.card[draggable="true"]').forEach(c => c.draggable = false);
});
L.addEventListener('dragstart', e => {
  const c = e.target.closest ? e.target.closest('.card.wait') : null;
  if (!c || !c.draggable) { e.preventDefault(); return; }
  drag = +c.dataset.i; drop = -1;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', 'song');
  c.classList.add('dragging');
});
L.addEventListener('dragover', e => {
  if (drag < 0) return;
  e.preventDefault();
  const c = e.target.closest('.card.wait');
  if (!c) return;
  clearMarks();
  const r = c.getBoundingClientRect(), i = +c.dataset.i;
  const before = e.clientY < r.top + r.height / 2;
  c.classList.add(before ? 'before' : 'after');
  drop = before ? i : i + 1;
});
L.addEventListener('drop', e => {
  if (drag < 0) return;
  e.preventDefault();
  let to = drop, from = drag;
  if (to >= 1) {
    if (to > from) to--;
    if (to !== from) commit(() => { const [x] = S.q.splice(from, 1); S.q.splice(to, 0, x); });
  }
});
L.addEventListener('dragend', () => { drag = -1; drop = -1; listKey = ''; render(); });

/* 셋리스트 복사: 부른 곡 → 지금 곡 → 대기 곡 순서, "1. 곡명" 형식 */
function legacyCopy(t) {
  const a = document.createElement('textarea');
  a.value = t; a.setAttribute('readonly', '');
  a.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(a); a.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  a.remove();
  if (!ok) throw new Error('copy failed');
}
function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(t).catch(() => legacyCopy(t));
  }
  try { legacyCopy(t); return Promise.resolve(); } catch (e) { return Promise.reject(e); }
}
const copyBtn = $('copy');
let copyTimer = 0;
function flashCopy(msg) {
  clearTimeout(copyTimer);
  copyBtn.textContent = msg;
  copyTimer = setTimeout(() => { copyBtn.textContent = '셋리스트 복사'; }, 1500);
}
copyBtn.onclick = () => {
  const all = [...S.d, ...S.q];
  if (!all.length) return;
  copyText(all.map((s, i) => (i + 1) + '. ' + s.t).join('\n'))
    .then(() => flashCopy('복사됨!'), () => flashCopy('복사 실패'));
};

/* 글자색 팔레트: 6칸 공유, 적용은 제목/메시지 각각 */
const pal = $('pal'), pslots = $('pslots'),
      pcol = $('pcol'), pedit = $('pedit'),
      prst = $('prst'), phint = $('phint');
let palTarget = null, palEdit = false, prstTimer = 0;
function renderPal() {
  if (palTarget === null) return;
  const cur = cfg[palTarget].toLowerCase();
  pslots.textContent = '';
  cfg.sw.forEach((c, i) => {
    const b = el('button', 'pslot' + (c === cur ? ' on' : ''));
    b.type = 'button'; b.style.background = c; b.title = c; b.dataset.i = i;
    pslots.appendChild(b);
  });
  if (pcol.value !== cur) pcol.value = cur;
  pal.classList.toggle('edit', palEdit);
  pedit.classList.toggle('on', palEdit);
  phint.textContent = palEdit ? '바꿀 칸을 누르면 지금 색으로 교체돼요' : '칸을 누르면 색이 적용돼요';
}
function openPal(t, btn) {
  if (pal.classList.contains('open') && palTarget === t) { closePal(); return; }
  palTarget = t; palEdit = false;
  pal.classList.add('open'); renderPal();
  const r = btn.getBoundingClientRect(), w = pal.offsetWidth, h = pal.offsetHeight;
  const x = Math.min(Math.max(6, r.left), Math.max(6, innerWidth - w - 6));
  let y = r.bottom + 6;
  if (y + h > innerHeight - 6 && r.top - h - 6 >= 6) y = r.top - h - 6;
  pal.style.left = x + 'px'; pal.style.top = y + 'px';
}
function closePal() {
  pal.classList.remove('open'); palTarget = null; palEdit = false; disarmPrst();
}
function disarmPrst() {
  clearTimeout(prstTimer); delete prst.dataset.arm; prst.textContent = '기본색 복원';
}
$('tcb').onclick = e => openPal('tc', e.currentTarget);
$('mcb').onclick = e => openPal('mc', e.currentTarget);
pslots.onclick = e => {
  const b = e.target.closest('.pslot');
  if (!b || palTarget === null) return;
  const i = +b.dataset.i;
  if (palEdit) { cfg.sw[i] = cfg[palTarget].toLowerCase(); palEdit = false; }
  else cfg[palTarget] = cfg.sw[i];
  saveRender();
};
pcol.oninput = () => {
  if (palTarget === null) return;
  cfg[palTarget] = pcol.value; saveRender();
};
pedit.onclick = () => { palEdit = !palEdit; renderPal(); };
prst.onclick = () => {
  if (!prst.dataset.arm) {
    prst.dataset.arm = '1'; prst.textContent = '한 번 더 누르면 복원';
    prstTimer = setTimeout(disarmPrst, 3000); return;
  }
  disarmPrst(); cfg.sw = DEF_SW.slice(); saveRender();
};
document.addEventListener('mousedown', e => {
  if (pal.classList.contains('open') && !e.target.closest('#pal, .cbtn')) closePal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePal(); });
window.addEventListener('scroll', closePal, true);
window.addEventListener('resize', closePal);

document.querySelectorAll('#thm button').forEach(b => { b.onclick = () => { cfg.theme = b.dataset.t; saveRender(); }; });
$('fold').onclick = () => { cfg.fold = !cfg.fold; closePal(); saveRender(); };

load(); syncControls(); render();
</script>
</body>
</html>
